services:
  - type: web
    name: imperiosur-api-efi
    runtime: docker
    plan: free
    healthCheckPath: /api/categorias/
    dockerCommand: python docker/start_production.py
    envVars:
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CARGAR_CATALOGO_DEMO
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: imperiosur-db-efi
          property: connectionString

databases:
  - name: imperiosur-db-efi
    plan: free
    ipAllowList: []
